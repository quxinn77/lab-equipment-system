server:
  port: 8080

spring:
  profiles:
    # 默认本地开发；生产部署设置环境变量 SPRING_PROFILES_ACTIVE=prod
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/lab_equipment?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    # 真实密码放在被忽略的 application-local.yml；生产用 MYSQL_PASSWORD 环境变量
    password: ${MYSQL_PASSWORD:}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  jackson:
    time-zone: GMT+8

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

lab:
  storage-type: local
  storage-path: ./upload-files
  jwt-secret: ${JWT_SECRET:lab-equipment-system-jwt-secret-2026}
  jwt-expire-hours: 24

logging:
  level:
    com.lab: info
